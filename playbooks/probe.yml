---
# Task list only (no hosts/become/vars/handlers) - loaded via include_tasks
# from the "Configure network prober" play in provision_all.yml, which
# supplies those.
#
# Replaces the old bash network_prober.sh with the C prober
# (../../../prober/). That switch dropped the gRPC path entirely (was
# already dead/commented out in the bash version), iperf3 (throughput is
# now a custom UDP protocol - see prober/context_for_claude.txt - so the
# iperf3 server this play used to start is no longer needed), and
# mosquitto-clients/jq (the C prober speaks MQTT and builds JSON itself,
# see prober/src/mqtt.c and prober/src/linkpublish.c).

- name: Ensure nameserver is configured
  ansible.builtin.lineinfile:
    path: /etc/resolv.conf
    line: "nameserver {{ fallback_dns }}"
    state: present

# network_prober.sh's get_neighbors() relied on batctl resolving MACs to
# node names via /etc/bat-hosts - the C prober no longer needs the file for
# its own peer table (it always asks neighbors directly via a multicast
# DISCOVER packet, see prober/src/discover.c, since the file isn't
# guaranteed complete) and instead keeps the file in sync FROM what it
# learns on the wire (prober/src/bathosts.c). This task now only matters as
# a bootstrap seed - so /etc/bat-hosts (and batctl's own use of it for
# `batctl o` display) isn't empty before the prober's first discovery round
# - and as a fallback for anything else on the node that still reads it.
# Every host computes the same bat_hosts_content independently (rather than
# a run_once + hostvars[] indirection) so this doesn't depend on every host
# reaching this task in the same forks batch - relies on ansible.cfg's
# forks being >= the fleet size so every host has already set its own
# bat_mac fact by the time any host reads the others' via hostvars.
- name: Get wlan0 MAC address
  ansible.builtin.command: cat /sys/class/net/wlan0/address
  register: wlan_mac
  changed_when: false

- name: Store BATMAN MAC
  ansible.builtin.set_fact:
    bat_mac: "{{ wlan_mac.stdout | trim }}"

- name: Slurp existing bat-hosts entries
  ansible.builtin.slurp:
    src: /etc/bat-hosts
  register: existing_bat_hosts
  failed_when: false

# groups['all'] only holds hosts the dynamic inventory could reach this run
# (see inventories/discover.py) - a powered-off node is dropped entirely, not
# just marked unreachable. Overwriting from groups['all'] alone would erase
# its MAC->name entry every time any node is down. Merge onto whatever this
# host already has on disk instead, so down nodes' entries survive; live
# entries win on conflict since they're fresher than whatever's on disk.
- name: Parse existing bat-hosts entries
  ansible.builtin.set_fact:
    bat_hosts_map: "{{ bat_hosts_map | default({}) | combine({(item.split(' ')[0]): item.split(' ')[1]}) }}"
  loop: "{{ (existing_bat_hosts.content | b64decode).splitlines() if existing_bat_hosts.content is defined else [] }}"
  when: item | trim != ''

- name: Merge in bat-hosts entries known this run
  ansible.builtin.set_fact:
    bat_hosts_map: "{{ bat_hosts_map | default({}) | combine({hostvars[item].bat_mac: item}) }}"
  loop: "{{ groups['all'] }}"
  when: hostvars[item].bat_mac is defined

- name: Build bat-hosts content
  ansible.builtin.set_fact:
    bat_hosts_content: |
      {% for mac, host in bat_hosts_map.items() %}
      {{ mac }} {{ host }}
      {% endfor %}

- name: Install /etc/bat-hosts
  ansible.builtin.copy:
    dest: /etc/bat-hosts
    content: "{{ bat_hosts_content }}"
    owner: root
    group: root
    mode: "0644"
  notify: Restart network_prober

# The pi never builds anything - it has no toolchain and no source. The
# binary is cross-compiled once, here, on the control node (see
# prober/Dockerfile - real cross-compiler, no QEMU) and only the resulting
# arm64 static executable is shipped out. Fixes two prior incidents from
# copying src/ wholesale and building on-device: dragging .git over the
# slow mesh link, and stray x86_64 .o files from a local `make` linking
# into a broken ARM binary. Also means 16 pis no longer each burn CPU/time
# compiling the identical source.
- name: Cross-compile prober for arm64
  delegate_to: localhost
  become: false
  run_once: true
  ansible.builtin.command:
    cmd: make docker-build
    chdir: "{{ playbook_dir }}/../../prober"
  changed_when: true

- name: Ensure prober directory exists
  ansible.builtin.file:
    path: /home/pi/prober
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy prober binary
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../prober/dist/prober"
    dest: /home/pi/prober/prober
    owner: root
    group: root
    mode: "0755"
  notify: Restart network_prober

- name: Deploy systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/network_prober.service
    mode: "0644"
    content: |
      [Unit]
      Description=Mesh network probe agent
      After=network.target

      [Service]
      ExecStart=/home/pi/prober/prober
      WorkingDirectory=/home/pi/prober
      Restart=always
      RestartSec=10
      # Soft CPU priority boost via the standard (fully preemptible) CFS
      # scheduler - insurance against colocated pods (mosquitto, inference
      # workloads) CPU-starving the prober, without the failure mode of a
      # real-time scheduling class wedging the node if the prober itself
      # misbehaves.
      Nice=-10
      Environment="NODE_ID={{ inventory_hostname }}"
      Environment="IFACE=wlan0"
      Environment="PROBE_PORT={{ prober_port }}"
      Environment="LATENCY_INTERVAL={{ prober_latency_interval }}"
      Environment="LATENCY_SAMPLES={{ prober_latency_samples }}"
      Environment="THROUGHPUT_GAP_MS={{ prober_throughput_gap_ms }}"
      Environment="THROUGHPUT_DURATION_MS={{ prober_throughput_duration_ms }}"
      Environment="DISCOVERY_INTERVAL={{ prober_discovery_interval }}"
      Environment="PROBE_TIMEOUT_MS={{ prober_timeout_ms }}"
      Environment="LOG_DIR=/logs"
      Environment="MAX_SIZE_KB={{ fieldlog_max_size_kb }}"
      Environment="LOG_ALL_ROUTES={{ fieldlog_all_routes }}"
      # Read-only here - fieldlog-resource.service's RuntimeDirectory owns
      # /run/fieldlog's lifecycle. This service keeps running regardless
      # (MQTT publish must never depend on a session being active); it only
      # uses the marker to decide whether to also write network/route CSVs.
      Environment="SESSION_MARKER=/run/fieldlog/session_id"
      Environment="MQTT_HOST={{ mqtt_host }}"
      Environment="MQTT_PORT={{ mqtt_port }}"
      Environment="MQTT_TOPIC={{ mqtt_topic_linkdata }}"

      [Install]
      WantedBy=multi-user.target
  notify: Restart network_prober

- name: Enable and start network_prober
  ansible.builtin.systemd:
    name: network_prober
    daemon_reload: true
    enabled: true
    state: started
