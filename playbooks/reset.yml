---
# Tears down all provisioning and returns every node to stock state. Order:
# k3s agents before k3s server, batman before interfaces, dnsmasq before resolved, reboot last.
#
# --tags cleanup_eth0 (opt-in, tagged never) fixes leftover dual-IP eth0 on
# nodes provisioned before the eth0 flush existed in provision_all.yml.
- name: Flush stale eth0 address left over from NetworkManager->networkd handoff
  hosts: all
  become: true
  gather_facts: false
  tags: [never, cleanup_eth0]

  tasks:
    - name: Flush eth0 and reapply netplan to reacquire a single clean lease (disrupts the connection)
      ansible.builtin.shell: ip addr flush dev eth0 && netplan apply
      async: 60
      poll: 0

    - name: Recover from network cataclysm (reconnect over mDNS)
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        ansible_host: "{{ pi_hostname }}.local"

    - name: Reset connection
      ansible.builtin.meta: reset_connection

    - name: Wait for connection
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 60

- name: Uninstall k3s agent from workers
  hosts: worker
  become: true
  gather_facts: false

  tasks:
    - name: Check if k3s-agent uninstall script exists
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-agent-uninstall.sh
      register: k3s_agent_uninstall

    - name: Run k3s-agent uninstall script
      ansible.builtin.shell: /usr/local/bin/k3s-agent-uninstall.sh
      when: k3s_agent_uninstall.stat.exists

- name: Uninstall k3s server from manager
  hosts: manager
  become: true
  gather_facts: false

  tasks:
    - name: Check if k3s uninstall script exists
      ansible.builtin.stat:
        path: /usr/local/bin/k3s-uninstall.sh
      register: k3s_uninstall

    - name: Run k3s uninstall script
      ansible.builtin.shell: /usr/local/bin/k3s-uninstall.sh
      when: k3s_uninstall.stat.exists

- name: Strip cgroup parameters from cmdline.txt on all nodes
  hosts: all
  become: true
  gather_facts: false

  tasks:
    - name: Strip cgroup parameters
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: ' ?(cgroup_enable=cpuset|cgroup_enable=memory|cgroup_memory=1|systemd\.unified_cgroup_hierarchy=1)'
        replace: ""

- name: Reset batman configuration on all hosts
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # Stop the service first so it can't undo the teardown mid-play.
    - name: Stop and disable batman service
      ansible.builtin.systemd:
        name: batman
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove wlan0 from batman-adv mesh
      ansible.builtin.command: batctl if del wlan0
      failed_when: false

    - name: Bring bat0 down
      ansible.builtin.command: ip link set bat0 down
      failed_when: false

    - name: Delete bat0 virtual interface
      ansible.builtin.command: ip link delete bat0
      failed_when: false

    - name: Unload batman-adv kernel module
      ansible.builtin.command: modprobe -r batman-adv
      failed_when: false

    - name: Bring wlan0 down before mode change
      ansible.builtin.command: ip link set wlan0 down
      failed_when: false

    - name: Restore wlan0 to managed mode
      ansible.builtin.command: iwconfig wlan0 mode managed
      failed_when: false

    # Leaving this breaks the next boot: networkd errors on the missing bat0 and blocks NetworkManager from owning eth0.
    - name: Remove netplan batman profile
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/netplan/90-netplan-batman.yaml
        # Pre-rename leftover name, still present on nodes provisioned before the rename.
        - /etc/netplan/90-netplan-workers.yaml

    - name: Remove batctl and wireless-tools packages
      ansible.builtin.apt:
        name:
          - batctl
          - wireless-tools
        state: absent

    - name: Remove batman config script
      ansible.builtin.file:
        path: /usr/local/bin/config_batman.sh
        state: absent

    # Disable only, don't stop now - networkd owns eth0 (the SSH path); the switch happens on the closing reboot.
    - name: Disable systemd-networkd (takes effect on next boot)
      ansible.builtin.systemd:
        name: systemd-networkd
        enabled: false

    - name: Enable NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        enabled: true
      failed_when: false

    - name: Enable wpa_supplicant
      ansible.builtin.systemd:
        name: wpa_supplicant
        enabled: true
      failed_when: false

- name: Reset NAT routing on manager
  hosts: manager
  become: true
  gather_facts: false

  tasks:
    - name: Stop and disable nat-routing service
      ansible.builtin.systemd:
        name: nat-routing
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove nat-routing systemd service file
      ansible.builtin.file:
        path: /etc/systemd/system/nat-routing.service
        state: absent

    - name: Remove iptables rules file
      ansible.builtin.file:
        path: /etc/iptables/nat-routing.rules
        state: absent

    - name: Flush iptables NAT rules
      ansible.builtin.command: iptables -t nat -F
      failed_when: false

    - name: Flush iptables filter rules
      ansible.builtin.command: iptables -F
      failed_when: false

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Disable IP forwarding
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "0"
        sysctl_set: true
        state: present
        reload: true

- name: Reset DHCP/DNS on manager
  hosts: manager
  become: true
  gather_facts: false

  tasks:
    - name: Stop and disable dnsmasq
      ansible.builtin.systemd:
        name: dnsmasq
        state: stopped
        enabled: false
      failed_when: false

    - name: Remove dnsmasq package
      ansible.builtin.apt:
        name: dnsmasq
        state: absent

    # Restore the systemd-resolved settings that configure_dhcp_server.yml
    # changed. Without this the Pi has no DNS after dnsmasq is gone.
    - name: Restore default DNS resolver
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^\s*#?DNS\b'
        line: "#DNS="

    - name: Restore fallback DNS
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^\s*#?FallbackDNS\b'
        line: "#FallbackDNS="

    - name: Clear local DNS search domain
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^\s*#?Domains\b'
        line: "#Domains="

    - name: Re-enable systemd-resolved stub listener
      ansible.builtin.lineinfile:
        path: /etc/systemd/resolved.conf
        regexp: '^\s*#?DNSStubListener\b'
        line: "#DNSStubListener=yes"

    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted

- name: Remove remaining artifacts from all hosts
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # Capability labels need no explicit teardown - the k3s uninstall scripts above already wipe that API state.
    # avahi-daemon ships preinstalled and is never touched, so the closing reboot can still reconnect via mDNS.
    - name: Stop and disable network_prober and iperf3 services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
        enabled: false
      loop:
        - network_prober
        - iperf3
      failed_when: false

    - name: Remove batman and network_prober service files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/batman.service
        - /etc/systemd/system/network_prober.service

    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: true

    # Excludes iptables/systemd-resolved (still used by tasks elsewhere here) and avahi-daemon (needed for the closing reboot).
    - name: Remove packages installed for provisioning features (network prober, capability detection)
      ansible.builtin.apt:
        name:
          - iperf3
          - jq
          - mosquitto-clients
          - i2c-tools
          - rpicam-apps
          - libcamera-apps
          - psmisc
          - gpsd
        state: absent
      failed_when: false

    - name: Re-enable cloud-init
      ansible.builtin.file:
        path: /etc/cloud/cloud-init.disabled
        state: absent

    # Guarded in case the "Set hostname on all nodes" play never ran on this node.
    - name: Remove custom PS1 prompt from /root/.bashrc
      ansible.builtin.blockinfile:
        path: /root/.bashrc
        marker: "# {mark} ANSIBLE MANAGED BLOCK - custom PS1"
        state: absent
      failed_when: false

    - name: Remove custom PS1 prompt from /home/pi/.bashrc
      ansible.builtin.blockinfile:
        path: /home/pi/.bashrc
        marker: "# {mark} ANSIBLE MANAGED BLOCK - custom PS1"
        state: absent
      failed_when: false

    - name: Remove nameserver line added for the network prober
      ansible.builtin.lineinfile:
        path: /etc/resolv.conf
        line: "nameserver {{ fallback_dns }}"
        state: absent

    - name: Remove /logs directory
      ansible.builtin.file:
        path: /logs
        state: absent

    - name: Remove prober and kubeconfig files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /usr/local/bin/grpcurl
        - /home/pi/message.proto
        - /home/pi/network_prober.sh
        - /home/pi/kubeconfig
        - /etc/bat-hosts

- name: Remove fetched kubeconfig from controller
  hosts: localhost
  gather_facts: false

  tasks:
    - name: Remove kubeconfig.yml
      ansible.builtin.file:
        path: "{{ playbook_dir }}/kubeconfig.yml"
        state: absent

- name: Reboot all hosts to clear remaining runtime state
  hosts: all
  become: true
  gather_facts: false

  tasks:
    # eth0 can get a new DHCP address across reboot; reconnect via mDNS instead of the stale pre-reboot IP.
    - name: Reconnect over mDNS for the reboot
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        ansible_host: "{{ pi_hostname }}.local"

    - name: Reboot
      ansible.builtin.reboot:
        # Real boot time runs ~130-145s across the fleet, past the old 120s timeout.
        reboot_timeout: 240
        post_reboot_delay: 10
