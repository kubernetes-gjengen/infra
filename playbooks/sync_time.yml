---
# Forces an immediate clock resync against manager0 before a logging session. Run before every
# start-logging, not just once at provision time - drift reaccumulates between field tests.

- name: Sync node clocks to manager0 before a logging session
  hosts: all
  become: true
  gather_facts: false
  # An unreachable node must not abort start-logging for every other node.
  ignore_unreachable: true

  tasks:
    # manager0's stratum-10 server mode never checks its own clock; a Pi with no RTC can free-run for
    # days while every worker syncs to that wrong time. Stamp manager0 from the laptop's real clock first.
    - name: Stop chrony so timedatectl will accept a manual correction
      ansible.builtin.systemd_service:
        name: chrony
        state: stopped
      when: "'manager' in group_names"

    - name: Correct manager0's own absolute clock from the laptop's (its own upstream reference has no internet either)
      ansible.builtin.command: >-
        timedatectl set-time "{{ lookup('pipe', 'date -u +%Y-%m-%d\ %H:%M:%S') }}"
      changed_when: true
      when: "'manager' in group_names"

    - name: Restart chrony now that the clock is corrected
      ansible.builtin.systemd_service:
        name: chrony
        state: started
      when: "'manager' in group_names"

    - name: Force an immediate resync
      ansible.builtin.command: chronyc makestep
      changed_when: false
      failed_when: false

    # Tuned loose (5ppm skew) - field logging every 5s doesn't need sub-second precision, and a tighter value produced false "did not sync" warnings on this hardware.
    - name: Wait for clock sync to converge
      ansible.builtin.command: chronyc waitsync 15 1 5 1
      register: wait_result
      changed_when: false
      failed_when: false

    - name: Warn if a node's clock never synced
      ansible.builtin.debug:
        msg: >-
          WARNING: {{ inventory_hostname }} did not sync to manager0 within ~15s
          ({{ (wait_result.stdout_lines | default([]) | last) | default('no chronyc output - is chrony installed? see tasks/configure_ntp.yml / `make provision TAGS=ntp`') }})
          - its logs for this session may be offset from the rest of the mesh.
      when: wait_result.rc != 0
