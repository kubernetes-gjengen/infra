---
# Capability detection config, consumed by tasks/detect_capabilities.yml.
# Each entry becomes k8s label `capability/<key>=true` on PRESENT (exit 0); exit 1 is ABSENT, anything else is ERROR (unlabeled).
# Fields: description (shown on ERROR), command, become, timeout (seconds), hosts (inventory group, default all).

capabilities:
  gps:
    description: "GPS receiver attached via the host's normalized /dev/gps0 symlink (USB dongle or Dragino LoRa/GPS HAT UART), confirmed via an actual attached device"
    become: true
    timeout: 30
    hosts: all
    # Trusts an already-open device (gps-client's own gpsd) directly; otherwise starts a throwaway gpsd
    # and waits for a TPV/SKY message, since an unwired UART opens fine but never produces one.
    command: |
      DEV=/dev/gps0
      if [ ! -e "$DEV" ]; then exit 1; fi
      if ! command -v fuser >/dev/null 2>&1; then exit 2; fi

      if fuser "$DEV" >/dev/null 2>&1; then
        exit 0
      fi

      if ! command -v gpsd >/dev/null 2>&1; then exit 2; fi

      PORT=12947
      gpsd -N -n -S "$PORT" "$DEV" >/dev/null 2>&1 &
      GPSD_PID=$!
      cleanup() { kill "$GPSD_PID" >/dev/null 2>&1; wait "$GPSD_PID" 2>/dev/null; }
      trap cleanup EXIT

      READY=0
      for i in $(seq 1 20); do
        if exec 3<>"/dev/tcp/127.0.0.1/$PORT" 2>/dev/null; then
          READY=1
          break
        fi
        sleep 0.25
      done
      if [ "$READY" -ne 1 ]; then exit 2; fi

      echo '?WATCH={"enable":true,"json":true}' >&3

      # No satellite fix required - any valid sentence triggers this, so an indoor GPS still passes.
      FOUND=0
      for i in $(seq 1 20); do
        LINE=$(timeout 0.5 head -n1 <&3 2>/dev/null)
        if echo "$LINE" | grep -q '"class":"TPV"' || echo "$LINE" | grep -q '"class":"SKY"'; then
          FOUND=1
          break
        fi
      done
      exec 3<&- 3>&-

      if [ "$FOUND" -eq 1 ]; then exit 0; else exit 1; fi

  ai-camera:
    description: "Raspberry Pi AI Camera (IMX500)"
    become: true
    timeout: 15
    hosts: all
    # become: true is required - /dev/dma_heap is root-only, so an unprivileged check false-negatives even with a real camera.
    command: |
      BIN=""
      if command -v rpicam-hello >/dev/null 2>&1; then
        BIN=rpicam-hello
      elif command -v libcamera-hello >/dev/null 2>&1; then
        BIN=libcamera-hello
      else
        exit 2
      fi
      OUT=$("$BIN" --list-cameras 2>&1)
      RC=$?
      if [ "$RC" -ne 0 ]; then exit 2; fi
      echo "$OUT" | grep -qi imx500 && exit 0 || exit 1

  sensehat:
    description: "Sense HAT (ATTINY88 LED matrix @ I2C addr 0x46)"
    become: true
    timeout: 10
    hosts: all
    # Matches both an idle address and a driver-claimed "UU" - a real Sense HAT already has its kernel driver bound.
    command: |
      if ! command -v i2cdetect >/dev/null 2>&1; then exit 2; fi
      OUT=$(i2cdetect -y 1 0x46 0x46 2>&1)
      RC=$?
      if [ "$RC" -ne 0 ]; then exit 2; fi
      echo "$OUT" | grep -qiE '46|UU' && exit 0 || exit 1

  rpi5:
    description: "Pi 5"
    become: false
    timeout: 5
    hosts: all
    # Only the Pi 5 reports "Raspberry Pi 5" in the device-tree model string.
    command: |
      MODEL=$(cat /proc/device-tree/model 2>/dev/null | tr -d '\0')
      if [ -z "$MODEL" ]; then exit 2; fi
      echo "$MODEL" | grep -q "Raspberry Pi 5" && exit 0 || exit 1

  rpi3:
    description: "Pi 3"
    become: false
    timeout: 5
    hosts: all
    command: |
      MODEL=$(cat /proc/device-tree/model 2>/dev/null | tr -d '\0')
      if [ -z "$MODEL" ]; then exit 2; fi
      echo "$MODEL" | grep -q "Raspberry Pi 3" && exit 0 || exit 1
