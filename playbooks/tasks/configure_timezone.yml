---
# Pins every node to the same zone; the stock OS image timezone can vary and skew log timestamps.

- name: Check current timezone
  ansible.builtin.command: timedatectl show -p Timezone --value
  register: current_tz
  changed_when: false

- name: Set timezone to {{ cluster_timezone }}
  ansible.builtin.command: "timedatectl set-timezone {{ cluster_timezone }}"
  become: true
  when: current_tz.stdout != cluster_timezone
