---
# Field tests have no internet, so nodes sync to manager0 (mesh time server) instead of
# public NTP pools. One-time setup; sync_time.yml forces a resync before each session.

- name: Install chrony
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
    cache_valid_time: 3600

# chrony is the one configured to use the mesh; only one NTP client may run.
- name: Disable systemd-timesyncd's own NTP client
  ansible.builtin.command: timedatectl set-ntp false
  changed_when: false

- name: Configure manager0 as the mesh time server
  ansible.builtin.blockinfile:
    path: /etc/chrony/chrony.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK - mesh time server"
    block: |
      # Always has a time to serve, even with no internet.
      local stratum 10
      allow {{ mesh_subnet_cidr }}
  when: "'manager' in group_names"

- name: Point workers' chrony client at manager0's mesh IP
  ansible.builtin.blockinfile:
    path: /etc/chrony/chrony.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK - mesh time client"
    block: |
      # prefer over any pool/default servers already in this file.
      server {{ manager_mesh_ip }} iburst prefer
  when: "'manager' not in group_names"

- name: Enable and restart chrony
  ansible.builtin.systemd:
    name: chrony
    daemon_reload: true
    enabled: true
    state: restarted
