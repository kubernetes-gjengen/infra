---
# Field-test resource logging. Installed disabled+stopped - `make
# start-logging` / `make stop-logging` toggle it, this play only makes sure
# it's present and configured. fieldlog_interval / fieldlog_max_size_kb come
# from group_vars/all.yml.

- name: Copy fieldlog resource script
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../shellscripts/fieldlog_resource.sh"
    dest: /home/pi/fieldlog_resource.sh
    owner: root
    group: root
    mode: "0755"
  notify: Restart fieldlog-resource

- name: Deploy fieldlog-resource systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/fieldlog-resource.service
    mode: "0644"
    content: |
      [Unit]
      Description=Field-test resource usage logger

      [Service]
      ExecStart=/home/pi/fieldlog_resource.sh
      Restart=always
      RestartSec=10
      # Auto-creates /run/fieldlog before start and - importantly - removes
      # it on stop/crash/SIGKILL alike, so the session marker the prober
      # reads never outlives this service without needing a script-side trap.
      RuntimeDirectory=fieldlog
      Environment="NODE_ID={{ inventory_hostname }}"
      Environment="LOG_DIR=/logs"
      Environment="INTERVAL={{ fieldlog_interval }}"
      Environment="MAX_SIZE_KB={{ fieldlog_max_size_kb }}"
      Environment="SESSION_MARKER=/run/fieldlog/session_id"

      [Install]
      WantedBy=multi-user.target
  notify: Restart fieldlog-resource

# Present but not running - `make start-logging` starts it on demand. A
# config-only change (e.g. fieldlog_interval) still needs to reach an
# already-running instance, hence the handler notify above; but this task
# itself must never flip a stopped logger to started.
- name: Ensure fieldlog-resource is enabled but not started
  ansible.builtin.systemd:
    name: fieldlog-resource
    daemon_reload: true
    enabled: true
