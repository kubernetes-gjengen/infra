---
- name: Configure cgroup parameters
  ansible.builtin.include_tasks: configure_cgroups.yml

- name: Reboot to apply cgroup settings
  ansible.builtin.reboot:
    reboot_timeout: 120
    post_reboot_delay: 60
  when: cgroups_changed | default(false)

- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: Ensure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

# Default k3s disruption-protection freezes eviction once >=55% of nodes go NotReady at
# once - exactly what powering off Pis does in this MANET testbed. These settings keep
# eviction fast and let PodGC clean up dead pod objects at our much smaller pod count.
- name: Deploy k3s server config (fast eviction + prompt terminal-pod GC)
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      kube-controller-manager-arg:
        - "large-cluster-size-threshold=0"
        - "secondary-node-eviction-rate=0.1"
        - "terminated-pod-gc-threshold=1"
  register: k3s_server_config

- name: Install k3s server
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | sh -
  args:
    executable: /bin/bash
  when: not k3s_bin.stat.exists

- name: Restart k3s to apply server config change
  ansible.builtin.systemd:
    name: k3s
    state: restarted
  when:
    - k3s_bin.stat.exists
    - k3s_server_config is changed

- name: Wait for node-token to appear
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    state: present
    timeout: 60

- name: Read join token
  ansible.builtin.shell: cat /var/lib/rancher/k3s/server/node-token
  register: join_token
  changed_when: false

# k3s watches this manifest dir and auto-applies it, so no separate kubectl step is needed.
- name: Deploy CoreDNS custom config (forward *.gotham to dnsmasq)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../coredns/coredns-custom.yml"
    dest: /var/lib/rancher/k3s/server/manifests/coredns-custom.yaml
    mode: "0644"
  register: coredns_custom

- name: Restart CoreDNS to pick up custom config
  ansible.builtin.command: >-
    kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
    -n kube-system rollout restart deployment coredns
  when: coredns_custom is changed
  changed_when: true
