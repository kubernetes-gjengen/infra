---
# Trusts the Zot registry's self-signed CA for containerd. registry_ca_cert_path must already
# exist on the controller - see registry/README.md to generate it.

- name: Ensure /etc/rancher/k3s exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Copy registry CA cert
  ansible.builtin.copy:
    src: "{{ registry_ca_cert_path }}"
    dest: /etc/rancher/k3s/registry-ca.crt
    owner: root
    group: root
    mode: "0644"
  register: registry_ca_cert

- name: Deploy containerd registry trust config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/registries.yaml
    owner: root
    group: root
    mode: "0644"
    content: |
      configs:
        "{{ registry_host }}":
          tls:
            ca_file: /etc/rancher/k3s/registry-ca.crt
  register: registries_config

# k3s only reads registries.yaml at startup; a change here is inert until the service restarts.
- name: Restart {{ k3s_service_name }} to pick up registry trust changes
  ansible.builtin.systemd:
    name: "{{ k3s_service_name }}"
    state: restarted
  when: registry_ca_cert is changed or registries_config is changed
