---
# Usage: ansible-playbook collect_logs.yml -e collect_dir=/abs/path
#
# Best-effort log fetch: a node that dropped off the mesh mid-experiment is
# skipped, not treated as a failure - that's expected during field tests,
# not an error condition.

- name: Collect field-test logs from all nodes
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  vars:
    collect_dir: "{{ playbook_dir }}/../collected-logs/manual"

  tasks:
    # Scoped to this host's own hostname prefix, not a bare "*.csv*" - a
    # physical Pi that was ever relabeled by discover.py's MAC-based naming
    # (e.g. when the worker9/10/11 hardware got auto-enrolled and reshuffled
    # assignments) keeps its previous identity's CSVs sitting in /logs
    # forever; NODE_ID only changes what *new* files get named, it doesn't
    # clean up old ones. An unscoped find would sweep those up too and
    # attribute another node's historical data to this one.
    - name: Find fieldlog CSVs
      ansible.builtin.find:
        paths: /logs
        patterns: "{{ inventory_hostname }}-*.csv*"
      register: found_logs
      ignore_unreachable: true
      ignore_errors: true

    # ignore_errors here for the same reason as the unreachable-node case
    # above: network_prober.sh writes to these files continuously (see
    # shellscripts/network_prober.sh), so fetching one mid-write can lose
    # the checksum race against a row that landed between the pre-transfer
    # stat and the post-transfer verification - that's expected raciness on
    # a live log, not a failure worth aborting the run over.
    - name: Fetch fieldlog CSVs
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ collect_dir }}/{{ inventory_hostname }}/"
        flat: true
      loop: "{{ found_logs.files | default([]) }}"
      loop_control:
        label: "{{ item.path | default('?') }}"
      when: found_logs is succeeded
      ignore_unreachable: true
      ignore_errors: true

    # k8-scheduler (manager0 only) isn't a fieldlog CSV - it's a k8s cluster
    # component logging continuously via journald, unrelated to
    # start-logging/stop-logging. journald already persists and rotates it
    # (systemd-managed, no extra writer/service needed), so this just reads
    # it on demand at collection time - zero standing overhead added by
    # collecting it. -o json gives a reliable per-line epoch timestamp
    # (__REALTIME_TIMESTAMP); the scheduler's own embedded "time=15:04:05"
    # field has no date and isn't safe to rely on alone.
    #
    # --since bounds this to scheduler_log_window (group_vars/all.yml) -
    # without it this pulls the scheduler's *entire* journal history on
    # every single collection (measured: 381MB / 339k lines for ~2 days at
    # log_level=debug), not just the current experiment.
    #
    # become: true (unlike the CSV tasks above, which rely on /logs being
    # world-writable) - journalctl needs root to read the system journal,
    # and writing to /tmp needs to consistently be the same user each run or
    # a stale file from a differently-privileged run blocks the next one
    # with a silent (failed_when: false) permission error.
    - name: Dump k8-scheduler journal
      ansible.builtin.shell: journalctl -u k8-scheduler -o json --no-pager --since "{{ scheduler_log_window }}" > /tmp/{{ inventory_hostname }}-scheduler.jsonl
      become: true
      when: inventory_hostname == 'manager0'
      changed_when: false
      failed_when: false

    - name: Fetch k8-scheduler journal
      ansible.builtin.fetch:
        src: "/tmp/{{ inventory_hostname }}-scheduler.jsonl"
        dest: "{{ collect_dir }}/{{ inventory_hostname }}/"
        flat: true
      become: true
      when: inventory_hostname == 'manager0'
      ignore_unreachable: true
      ignore_errors: true
