---
# Usage: ansible-playbook collect_logs.yml -e collect_dir=/abs/path
# Best-effort: a node dropped off the mesh mid-experiment is skipped, not a failure.
# use_ssh_args: true is required so synchronize picks up discover.py's mesh ProxyCommand for .gotham-only hosts.

- name: Collect field-test logs from all nodes
  hosts: all
  gather_facts: false
  ignore_unreachable: true
  vars:
    collect_dir: "{{ playbook_dir }}/../collected-logs/manual"

  tasks:
    # rsync only creates one missing leaf directory; the parent must exist first.
    - name: Ensure local per-node collect directory exists
      ansible.builtin.file:
        path: "{{ collect_dir }}/{{ inventory_hostname }}"
        state: directory
        mode: "0755"
      delegate_to: localhost

    # Scoped to this host's own hostname prefix so a MAC-relabeled node doesn't sweep up another node's old CSVs.
    - name: Fetch fieldlog CSVs
      ansible.posix.synchronize:
        mode: pull
        src: "/logs/"
        dest: "{{ collect_dir }}/{{ inventory_hostname }}/"
        use_ssh_args: true
        rsync_opts:
          - "--include={{ inventory_hostname }}-*.csv*"
          - "--exclude=*"
      ignore_unreachable: true
      ignore_errors: true

    # --since bounds this to scheduler_log_window; without it this pulls the entire journal history every time.
    - name: Dump k8-scheduler journal
      ansible.builtin.shell: journalctl -u k8-scheduler -o json --no-pager --since "{{ scheduler_log_window }}" > /tmp/{{ inventory_hostname }}-scheduler.jsonl
      become: true
      when: inventory_hostname == 'manager0'
      changed_when: false
      failed_when: false

    - name: Fetch k8-scheduler journal
      ansible.builtin.fetch:
        src: "/tmp/{{ inventory_hostname }}-scheduler.jsonl"
        dest: "{{ collect_dir }}/{{ inventory_hostname }}/"
        flat: true
      become: true
      when: inventory_hostname == 'manager0'
      ignore_unreachable: true
      ignore_errors: true

    # Reads kubelet's local log file directly instead of `kubectl logs`, which would relay it over the mesh.
    # find+fetch, not synchronize: rsync needs passwordless sudo on the remote end, which isn't guaranteed on every node.
    # file_type: link is required - these paths are symlinks, and find's default excludes symlinks.
    - name: Find radio-wrapper app pod container logs
      ansible.builtin.find:
        paths: /var/log/containers
        patterns:
          - "radio-receiver-*.log*"
          - "radio-processor-*.log*"
        file_type: link
      register: found_app_logs
      become: true
      ignore_unreachable: true
      ignore_errors: true

    # fetch follows the symlink transparently; no extra option needed.
    - name: Fetch radio-wrapper app pod container logs
      ansible.builtin.fetch:
        src: "{{ item.path }}"
        dest: "{{ collect_dir }}/{{ inventory_hostname }}/"
        flat: true
      loop: "{{ found_app_logs.files | default([]) }}"
      loop_control:
        label: "{{ item.path | default('?') }}"
      become: true
      when: found_app_logs is succeeded
      ignore_unreachable: true
      ignore_errors: true
