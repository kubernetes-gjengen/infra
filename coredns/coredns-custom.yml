# Scopes *.gotham resolution for in-cluster pods to the manager's dnsmasq via its stable mesh IP.
# k3s wires this ConfigMap in automatically; requires a CoreDNS pod restart to pick up.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  gotham.server: |
    gotham:53 {
        errors
        cache 30
        forward . 192.168.42.1
    }
